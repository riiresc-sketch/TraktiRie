<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkBio — TraktiRie</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: { 50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',400:'#a78bfa',500:'#6b5b95',600:'#4c2f85',700:'#2d1b54',800:'#120c22',900:'#0c0818',950:'#05030c' },
            sky: { 400:'#c084fc',500:'#a855f7',600:'#7c3aed',900:'#3b1f6b' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#05030c">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/service-worker.js").catch(()=>{}));
    }
  </script>
</head>
<body class="font-sans antialiased min-h-screen" style="background:#05030c;color:#fff">
  <div class="max-w-md mx-auto px-4 py-12">
    <div class="text-center mb-8">
      <div class="avatar-ring w-28 h-28 mx-auto mb-4">
        <img id="profileAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=IyanDev&backgroundColor=8b5cf6" alt="Avatar" class="w-full h-full rounded-full" style="background:var(--tr-bg-secondary)">
      </div>
      <h1 id="profileName" class="text-2xl font-bold">@IyanDev</h1>
      <p id="profileBio" class="text-sm mt-1" style="color:var(--tr-text-muted)">Founder & Creator • TraktiRie</p>
      <div id="socialRow" class="flex justify-center gap-3 mt-4"></div>
      <div id="catNav" class="flex flex-wrap justify-center gap-2 mt-4 text-xs"></div>
    </div>
    <div id="linksContainer" class="space-y-3"></div>
    <p class="text-center text-xs mt-10" style="color:var(--tr-text-muted)">
      Powered by <a href="/index.html" style="color:var(--tr-primary)">TraktiRie</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/backend-config.js"></script>
  <script src="js/backend-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/theme-engine.js"></script>
  <script>
    const DEFAULT_LINKS = [
      { title: 'Support / Donation', url: '/IyanDev/support', style: 'primary', icon: 'heart' },
      { title: 'Open Commission', url: '/IyanDev/commission', style: 'secondary', icon: 'film' },
      { title: 'Digital Shop', url: '/IyanDev/shop', style: 'secondary', icon: 'cart' },
      { title: 'Portfolio & Karya', url: '#', style: 'secondary', icon: 'spark' },
      { title: 'Join Community', url: '#', style: 'secondary', icon: 'chat' }
    ];
    const DEFAULT_SOCIALS = [
      { name: 'Instagram', url: 'https://instagram.com', icon: 'ig' },
      { name: 'YouTube', url: 'https://youtube.com', icon: 'yt' },
      { name: 'TikTok', url: 'https://tiktok.com', icon: 'tt' }
    ];

    function getUsernameFromUrl() {
      return TraktiRieRouter.getUsernameFromUrl('IyanDev');
    }

    function iconSvg(type) {
      const icons = {
        ig: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-.148 4.771-1.699 4.919-4.92.058-1.265.07-1.644.07-4.849 0-3.204-.013-3.583-.07-4.849-.149-3.227-1.664-4.771-4.919-4.919-1.266-.057-1.645-.069-4.849-.069zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>',
        yt: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
        tt: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.7a8.18 8.18 0 004.77 1.52V6.84a4.84 4.84 0 01-1.3-.15z"/></svg>',
        x: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
        discord: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.36-.62.686-1.271.973-1.96a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128c.126-.094.252-.192.372-.292a.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>',
        github: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>',
        twitch: '<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>',
        web: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>',
        default: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>'
      };
      return icons[type] || icons.default;
    }

    function radiusClass(style) {
      if (style === 'pill') return 'rounded-full';
      if (style === 'soft') return 'rounded-xl';
      return 'rounded-2xl';
    }

    async function render(username) {
      const theme = await TraktiRieTheme.getTheme('linkbio', username);
      TraktiRieTheme.applyThemeToDocument(theme);

      let displayName = username;
      let bio = 'Creator on TraktiRie';
      let avatarSeed = username;
      if (window.SWAuth) {
        const found = await SWAuth.getProfileByUsername(username);
        if (found) {
          displayName = found.displayName || found.username;
          bio = found.bio || bio;
          avatarSeed = found.avatarUrl || found.username;
        }
      }

      const config = (await TraktiRieTheme.getLinkBioConfig(username)) || {};
      const links = config.links || (window.TraktiRieRouter ? TraktiRieRouter.defaultPublicLinks(username) : DEFAULT_LINKS);
      const socials = config.socials || DEFAULT_SOCIALS;
      if (config.bio) bio = config.bio;
      if (config.displayName) displayName = config.displayName;

      document.title = (displayName || username) + ' — TraktiRie';
      document.getElementById('profileName').textContent = displayName || ('@' + username);
      document.getElementById('profileBio').textContent = bio;
      var av = document.getElementById('profileAvatar');
      if (avatarSeed && /^https?:\/\//i.test(avatarSeed)) {
        av.src = avatarSeed;
      } else {
        av.src = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(avatarSeed || username) + '&backgroundColor=8b5cf6';
      }

      const socialRow = document.getElementById('socialRow');
      socialRow.innerHTML = socials.filter(function(s) { return s && s.url; }).map(function(s) {
        return '<a href="' + s.url + '" target="_blank" rel="noopener" class="w-10 h-10 rounded-full flex items-center justify-center transition hover:opacity-80" style="background:var(--tr-card-bg);color:var(--tr-text)" title="' + (s.name || '') + '">' + iconSvg(s.icon) + '</a>';
      }).join('');

      const r = radiusClass(theme.buttonStyle);
      const shadow = theme.buttonShadow ? 'shadow-lg' : '';
      
      var catNav = document.getElementById('catNav');
      if (catNav && window.TraktiRieRouter) {
        var cats = [['linkbio','LinkBio'],['shop','Shop'],['commission','Commission'],['support','Support']];
        catNav.innerHTML = cats.map(function(c){
          var active = c[0]==='linkbio';
          return '<a href="'+TraktiRieRouter.publicUrl(username,c[0])+'" class="px-3 py-1.5 rounded-full border '+(active?'border-violet-500 bg-violet-500/20':'border-white/10')+'" style="color:var(--tr-text)">'+c[1]+'</a>';
        }).join('');
      }

      const container = document.getElementById('linksContainer');
      container.innerHTML = links.map(function(link) {
        const isPrimary = link.style === 'primary';
        const cls = 'linkbio-btn relative flex items-center w-full py-4 px-5 ' + r + ' font-semibold transition ' + shadow + (isPrimary ? ' primary' : ' secondary');
        const iconKey = link.icon || link.emoji || 'link';
        const left = (window.TraktiRieIcons
          ? TraktiRieIcons.iconBadge(iconKey)
          : '<span class="absolute left-4 w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background:rgba(255,255,255,0.15)">' + iconSvg('default') + '</span>');
        return '<a href="' + (link.url || '#') + '" class="' + cls + '">' + left + '<span class="flex-1 text-center">' + (link.title || 'Link') + '</span></a>';
      }).join('');
    }

    render(TraktiRieRouter.getUsernameFromUrl('IyanDev'));
  </script>
</body>
</html>
